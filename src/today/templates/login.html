{% extends "base.html" %}
{% block title %}{{ t('sign_in_title') }} · today{% endblock %}
{% block body %}
<main class="login">
  <div class="login-top"><p class="eyebrow">TODAY</p>{% include "_lang_switch.html" %}</div>
  <h1 class="login-title">{{ t("sign_in_title") }}</h1>
  <form method="post" action="/login" class="login-form">
    <label for="passphrase" class="label">{{ t("passphrase") }}</label>
    <input id="passphrase" name="passphrase" type="password" autocomplete="current-password" required autofocus>
    {% if error %}<p class="error" role="alert">{{ t(error) }}</p>{% endif %}
    <button type="submit" class="btn-accent">{{ t("sign_in") }}</button>
  </form>
</main>
{% endblock %}
